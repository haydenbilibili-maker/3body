# 持续集成：PR 与非 main 分支推送时运行前端构建 + 后端测试
# （main 分支的部署由 deploy-pages.yml 负责，构建步骤与此一致）
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build (vue-tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (type-check + bundle)
        run: npm run build -- --base=/3body/

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements-core.txt
            requirements-test.txt

      - name: Install (core + test, no RAG/torch)
        run: pip install -r requirements-test.txt

      - name: Pytest
        run: pytest
